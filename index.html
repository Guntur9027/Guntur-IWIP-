      ?`<div class="big">${q.score}<small>dari ${q.total} benar</small></div><p class="muted">${q.score===q.total?'Sempurna. Semua jawabanmu benar.':q.score/q.total>=.7?'Bagus, hampir semuanya kamu kuasai.':'Terus latihan, kata-kata ini akan makin akrab.'}</p>`
      :`<div class="big">${q.score}<small>jawaban benar</small></div>${fxOn('kilat','summary')&&q.total?`<p class="muted">Akurasi ${Math.round(q.score/q.total*100)}% (${q.score} dari ${q.total})</p>`:''}<p class="muted">${q.newBest?'Rekor baru untukmu.':`Rekor terbaikmu ${S.best} jawaban benar.`}</p>`;
    return {top:bar('Kuis',{back:true}),body:`<div class="result"><p class="muted">${q.mode==='klasik'?'Kuis selesai':'Waktu habis'}</p>${head}
      <div class="acts">
        ${q.mode==='kilat'?`<button class="btn primary" data-a="qplus">Tambah 30 detik dan lanjut</button>`:''}
        ${missed.length?`<button class="btn ${q.mode==='kilat'?'ghost':'primary'}" data-a="qreview">Latih ${missed.length} kata yang salah</button>`:''}
        <button class="btn ghost" data-a="qstart">Main lagi</button>
        <button class="btn ghost" data-a="qsetup">Ubah pengaturan</button>
      </div></div>${list}`};
  }
  const c=q.cur;
  const prompt=c.dir==='p2a'
    ?`<div class="qprompt">${c.w.hanzi?`<div class="hz" lang="zh-Hans">${esc(c.w.hanzi)}</div>`:''}<div class="py">${esc(c.w.pinyin)}</div><div class="qtools"><button class="btn soft sm" data-a="speak" data-id="${c.w.id}">${ic('vol',18)}Mandarin</button></div></div>`
    :`<div class="qprompt"><div class="ar">${esc(mean(c.w))}</div><div class="qtools"><button class="btn soft sm" data-a="speakID" data-id="${c.w.id}">${ic('vol',18)}Indonesia</button></div></div>`;
  const hid=(q.mode==='kilat'&&q.hintFor===c)?q.hidden:-1;
  const opts=c.options.map((o,i)=>`<button class="opt${i===hid?' gone':''}" data-a="pick" data-i="${i}" ${i===hid?'disabled':''}>${optHtml(o,c.dir)}</button>`).join('');
  let head;
  if(q.mode==='kilat'){
    head=`<div class="timer"><div class="tbar"><i id="kbar" style="width:${clamp(q.left/S.kilat.duration*100,0,100)}%"></i></div><div class="tmeta"><span><b id="ktxt">${Math.ceil(q.left)}</b> detik<span id="kdelta"></span></span><span><b id="ksc">${q.score}</b> benar</span></div></div>`;
  }else{
    head=`<div class="lin"><i style="width:${q.qi/q.queue.length*100}%"></i></div>`;
  }
  return {top:bar(q.mode==='kilat'?'Kilat':'Kuis',{back:true,right:q.mode==='klasik'?`<span class="bar-meta">${q.qi+1} dari ${q.queue.length}</span>`:''}),body:`${head}${q.mode==='kilat'?kTools(q):''}${prompt}<div class="opts">${opts}</div>${kPro(q)}`};
}
function qPick(i){
  const q=V.q;if(!q||q.stage!=='run'||q.locked)return;
  q.locked=true;
  const c=q.cur,ok=i===c.ans;
  rec(c.w.id,ok);sfx(ok?'benar':'salah');
  const btns=main.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  btns[i].classList.add(ok?'ok':'bad');
  if(!ok)btns[c.ans].classList.add('ok');
  q.total++;
  if(ok)q.score++;else q.miss.push(c.w.id);
  (q.hist=q.hist||[]).push(ok);
  if(q.mode==='kilat')buzz(ok?10:[18,30,18],'kilat');
  if(c.dir==='a2p'&&S.autoplay)sayCN(c.w);
  if(q.mode==='kilat'){
    const d=ok?S.kilat.bonus:-S.kilat.penalty;
    q.left=Math.min(S.kilat.max,q.left+d);
    const dl=$('#kdelta');if(dl&&d){dl.textContent=(d>0?'+':'−')+Math.abs(d);dl.className=d>0?'up':'dn'}
    const sc=$('#ksc');if(sc)sc.textContent=q.score;
    paintKilat();
  }
  setTimeout(()=>{
    if(V.name!=='kuis'||V.q!==q||q.stage!=='run')return;
    if(q.mode==='klasik')q.qi++;
    q.cur=nextQ();q.locked=false;
    if(!q.cur){sfx('levelup');endQuiz();return}
    render();speakQ();
  },q.mode==='kilat'?(ok?380:800):(ok?700:1300));
}

}
function rPasangan(){
  const m=V.m;
  if(m.result){
    return {top:bar('Pasangan',{back:true}),body:`<div class="result"><p class="muted">Semua pasangan cocok</p><div class="big">${fmtT(m.secs)}<small>dengan ${m.moves} langkah</small></div>
      <div class="acts"><button class="btn primary" data-a="pagain">Main lagi</button><button class="btn ghost" data-a="back">Kembali</button></div></div>`};
  }

    return `<button class="tile" data-a="tile" data-i="${i}" aria-label="Kartu ${i+1}"><span class="tile-in"><span class="tf tf-down"><i aria-hidden="true">拼</i></span><span class="tf tf-up">${c}</span></span></button>`;
  }).join('');

function pTile(i){
  const m=V.m;if(!m||m.lock||m.fin||m.done.has(i)||m.open.includes(i))return;
  const el=main.querySelector(`.tile[data-i="${i}"]`);if(!el)return;
  sfx('klik');
  el.classList.add('is-open');m.open.push(i);
  const w0=wid(m.tiles[i].id);if(w0&&S.autoplay){if(m.tiles[i].k==='cn')sayCN(w0);else sayID(w0)}
  if(m.open.length<2)return;
  m.moves++;$('#mmoves').textContent=m.moves;
  const [a,b]=m.open,A=m.tiles[a],B=m.tiles[b];
  if(A.id===B.id&&A.k!==B.k){
    m.done.add(a);m.done.add(b);
    [a,b].forEach(x=>main.querySelector(`.tile[data-i="${x}"]`).classList.add('is-done'));
    m.open=[];$('#mmatch').textContent=m.done.size/2;
    rec(A.id,true);sfx('benar');
    if(m.done.size===m.tiles.length){
      m.fin=true;clearInterval(T.pair);m.secs=(Date.now()-m.t0)/1000;
      setTimeout(()=>{if(V.name==='pasangan'&&V.m===m){m.result=true;sfx('levelup');bgmStop();render()}},1000);
    }
  }else{
    m.lock=true;
    setTimeout(()=>{
      sfx('salah');
      m.open.forEach(x=>{const e=main.querySelector(`.tile[data-i="${x}"]`);if(e)e.classList.remove('is-open')});
      m.open=[];m.lock=false;
    },900);
  }
}

function hSpeak(){const h=V.h;if(!S.autoplay||!h||h.over)return;if(h.mode==='pinyin')sayCN(h.cur.w);else sayID(h.cur.w)}
const HSPD=[0.7,1,1.4],HSPD_L=['Pelan','Normal','Cepat'];
function hTally(ok,w){const h=V.h;h.total++;if(ok)h.right++;else if(w&&!h.missed.some(m=>m.id===w.id))h.missed.push(w)}

const HFONTS=[['Sistem',"var(--ui)"],['Serif',"Georgia,'Times New Roman',serif"],['Bulat',"ui-rounded,'Varela Round','Trebuchet MS',sans-serif"],['Mono',"ui-monospace,Menlo,Consolas,monospace"],['Balok',"Impact,'Arial Black','Helvetica Neue',sans-serif"]];

function hHint(){const h=V.h;if(!h||h.over||h.locked||h.paused||h.hinted)return;const c=h.cur,o=c.options[c.ans];const t=(c.dir==='p2a'?mean(o):o.pinyin)||'';h.hinted=true;h.score=Math.max(0,h.score-1);h.hintTxt=t.charAt(0)+'…';const hh=$('#hhint');if(hh)hh.textContent='Petunjuk: awalan "'+h.hintTxt+'"';hPaint();hCtlPaint()}

/* ---------- Teka-teki ---------- */
function startTeka(){

function tNew(silent){
  const t=V.t;if(!t)return;
  const cands=pool().filter(x=>x.id!==t.last);const hardC=cands.filter(x=>x.wrong>0);const arr=(fxOn('teka','hard')&&hardC.length)?hardC:cands;const w=arr.length?arr[Math.floor(Math.random()*arr.length)]:pickOne(t.last);t.last=w.id;t.q=w;
  t.bank=t.mode==='arti_pinyin'?shuffle(Array.from(w.pinyin.replace(/\s+/g,'')).map(ch=>({id:uid(),ch,used:false}))):[];

}

function tShake(){render();const c=document.querySelector('.tcard');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}}
function tOk(){const t=V.t,w=t.q;if(!w)return false;if(t.mode==='arti_pinyin'){const got=t.seq.map(x=>x.ch).join('').toLowerCase(),want=w.pinyin.replace(/\s+/g,'').toLowerCase();return got.length>0&&got===want}const o=t.input.trim().toLowerCase();if(!o)return false;return mean(w).toLowerCase().split(/[\/,]|\bor\b|atau/).map(x=>x.trim()).filter(Boolean).some(x=>(x.includes(o)&&o.length>=3)||(o.includes(x)&&x.length>=3)||x===o)}
function tAuto(){const t=V.t;if(!t||!t.q||t.locked||!fxOn('teka','auto'))return;if(t.mode==='arti_pinyin'){if(t.seq.length===t.q.pinyin.replace(/\s+/g,'').length)tCheck()}else if(tOk())tCheck()}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='tinput'&&V.name==='teka'&&V.t){V.t.input=e.target.value;tAuto()}});
function tCheck(){
  const t=V.t,w=t.q;if(!w||t.locked)return;
  let ok=false;
  if(t.mode==='arti_pinyin'){
    const got=t.seq.map(s=>s.ch).join('').toLowerCase(),want=w.pinyin.replace(/\s+/g,'').toLowerCase();
    if(!got)return;ok=got===want;
  }else{
    const o=t.input.trim().toLowerCase();if(!o)return;
    ok=mean(w).toLowerCase().split(/[\/,]|\bor\b|atau/).map(s=>s.trim()).filter(Boolean).some(s=>(s.includes(o)&&o.length>=3)||(o.includes(s)&&s.length>=3)||s===o);
  }
  if(ok){
    t.locked=true;sfx('benar');rec(w.id,true);buzz(10,'teka');t.hist=[...(t.hist||[]),true].slice(-5);t.tot=(t.tot||0)+1;t.okc=(t.okc||0)+1;
    t.score+=10+t.streak*2;t.streak++;if(t.streak>(S.tBest||0)){S.tBest=t.streak;persist()}t.reveal=t.mode==='arti_pinyin'?w.pinyin:mean(w);t.revealBad=false;
    render();
    (async()=>{await sayCN(w);if(V.name!=='teka'||V.t!==t)return;await sleep(250);t.locked=false;if(V.name==='teka'&&V.t===t)tNew()})();
  }else{
    sfx('salah');rec(w.id,false);t.streak=0;buzz([18,30,18],'teka');t.hist=[...(t.hist||[]),false].slice(-5);t.tot=(t.tot||0)+1;
    t.reveal=t.mode==='arti_pinyin'?w.pinyin:mean(w);t.revealBad=true;
    tShake();
    setTimeout(()=>{if(V.name==='teka'&&V.t===t&&t.revealBad){t.reveal='';t.revealBad=false;render()}},1800);
  }
}
function tHint(){
  const t=V.t,w=t.q;if(!w||t.hints<=0)return;
  t.hints--;sfx('klik');
  if(t.mode==='arti_pinyin'){
    const ch=w.pinyin.replace(/\s+/g,'')[0];
    if(!t.seq.length){const b=t.bank.find(x=>x.ch===ch&&!x.used);if(b){b.used=true;t.seq=[{id:uid(),ch,tid:b.id}]}}
    t.score=Math.max(0,t.score-5);
  }else{
    if(mean(w).length>=2){t.reveal=mean(w).slice(0,2)+'...';t.revealBad=false}
    t.score=Math.max(0,t.score-2);
  }
  render();
}

async function pLoop(my){
  const SEQ={cn_id:['cn','id'],id_cn:['id','cn'],cn_only:['cn'],id_only:['id']};
  while(my===runId&&V.name==='dengar'&&V.p.playing){
    const p=V.p,w=wid(p.queue[p.i]);if(!w)break;
    if(p.sleepAt&&Date.now()>=p.sleepAt){p.sleepAt=0;p.sleepMin=0;pPause();toast('Timer tidur selesai, pemutaran dihentikan');break}
    paintPlayer();
    for(const ph of SEQ[S.player.order]||SEQ.cn_id){
      if(my!==runId)return;
      setPhase(ph);
      await (ph==='cn'?sayCN(w,true,S.player.rate):sayID(w,true));
      if(my!==runId)return;
      await sleep(350);
    }
    setPhase('');
    p.played=(p.played||0)+1;
    await sleep(S.player.delay*1000);
    if(my!==runId)return;
    if(S.player.loop==='one')continue;
    if(p.i+1>=p.queue.length){
      if(S.player.loop==='all'){p.i=0;if(S.player.shuffle)p.queue=shuffle(p.queue)}
      else{p.playing=false;paintCtl();return}
    }else p.i++;
  }

/* ---------- Kata ---------- */
function filtered(){
  const {q,f,g}=V.kt,qq=fold(q.trim());
  let l=ordered();
  if(g!=='all')l=l.filter(w=>w.g===g);
  if(f==='aktif'){const ids=new Set(pool().map(w=>w.id));l=l.filter(w=>ids.has(w.id))}
  else if(f==='sulit')l=l.filter(w=>w.correct<3||w.wrong>0);
  else if(f==='belum')l=l.filter(w=>w.correct<3);
  else if(f==='bintang')l=l.filter(w=>w.star);
  else if(f==='kuasai')l=l.filter(w=>w.correct>=3);
  if(qq)l=l.filter(w=>fold(w.pinyin+' '+mean(w)).includes(qq)||(w.hanzi&&w.hanzi.includes(q.trim())));
  return l;
}

    out+=`<li class="w ${w.hanzi?'':'nohz'} ${act.has(w.id)?'':'off'}" data-a="wopen" data-id="${w.id}">

    <button class="icon-btn sm" data-a="speak" data-id="${w.id}" aria-label="Dengarkan">${ic('vol',19)}</button>

  return out;
}

async function trEn(t){
  // 1) Claude di dalam halaman publikasi (jika tersedia dan diizinkan)
  try{
    const sample=(typeof claude!=='undefined'&&claude.use)?await claude.use('sample'):null;
    if(sample){
      const r=await sample('Translate this Indonesian word or phrase into concise English. Reply with only the English translation, nothing else.\n\n'+t,{modelTier:'quick',cache:true});
      const x=String((r&&r.text)||'').trim().replace(/^["'`]+|["'`.]+$/g,'').trim().toLowerCase();
      if(x&&x.length<200)return x;
    }
  }catch(e){}
  // 2) Cadangan: layanan terjemahan langsung (berjalan di pemasangan mandiri)
  try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=id|en');const j=await r.json();const x=(j&&j.responseData&&j.responseData.translatedText)||'';return x&&!/MYMEMORY|INVALID|QUERY LENGTH/i.test(x)?x.trim().toLowerCase():''}catch(e){return ''}
}

function parseBulk(txt){
  const out=[];
  for(const raw of txt.split('\n')){
    const r=raw.trim().replace(/^(\d+\s*[.)]|\.)\s*/,'').trim();if(!r)continue;
    let py='',hz='',ar='',en='';
    if(r.includes('|')){
      const a=r.split('|').map(s=>s.trim()).filter(Boolean);
      if(a.length>=4){py=a[0];hz=a[1];ar=a[2];en=a.slice(3).join('; ')}
      else if(a.length>=3){py=a[0];hz=a[1];ar=a.slice(2).join(' ')}
      else if(a.length===2){py=a[0];if(/[\u4e00-\u9fff]/.test(a[1]))hz=a[1];else ar=a[1]}
      else py=a[0];
    }else if(r.includes(' - ')){const i=r.indexOf(' - ');py=r.slice(0,i).trim();ar=r.slice(i+3).trim()}
    else if(r.includes('-')){const i=r.indexOf('-');py=r.slice(0,i).trim();ar=r.slice(i+1).trim()}
    else continue;
    py=py.replace(/[\u4e00-\u9fff]/g,'').trim()||py.trim();
    if(!py||(!ar&&!hz))continue;
    out.push({pinyin:py,hanzi:hz,arti:ar||'-',en});
  }
  return out;
}

function setPath(path,val){
  const ks=path.split('.');let o=S;

function applyInput(el,final){
  let v;const t=el.dataset.t,p=el.dataset.s;
  if(el.type==='checkbox'){v=el.checked;if(el.dataset.inv)v=!v}
  else if(t==='num'){
    if(el.type==='number'){
      if(!final)return;
      if(el.value===''&&p==='active')v=0;
      else{v=parseFloat(el.value);if(isNaN(v))return;v=clamp(Math.round(v),+el.dataset.min,+el.dataset.max);el.value=v}
    }else v=parseFloat(el.value);
  }else v=el.value;
  setPath(p,v);
  if(p==='selG')V.hero=null;
  if(p==='player.delay'){const o=$('#pdv');if(o)o.textContent=v+' detik'}
  if(p==='speed'){const o=$('#spv');if(o)o.textContent=v+'x'}
  if(p==='bgm.vol'){const o=$('#bvv');if(o)o.textContent=Math.round(v*100)+'%';BG.audio.volume=v}
  if(p==='bgm.loop')BG.audio.loop=v;
  if(p==='bgm.muted'){if(v)bgmStop();else if(V.bgmPrev)bgmPlay()}
  if(p==='muted'&&S.muted){stopSpeech();bgmStop()}
  if(p==='active'||p==='focus')V.hero=null;
  if(p==='sfx'&&v)sfx('benar');
}

document.addEventListener('keydown',e=>{
  if(V.name!=='kartu'||!V.k||V.k.done||!fxOn('kartu','keys'))return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=V.k;
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();kFlip()}
  else if(e.key==='ArrowLeft'){if(k.flip){e.preventDefault();kAnswer(false)}}
  else if(e.key==='ArrowRight'){if(k.flip){e.preventDefault();kAnswer(true)}}
  else if(e.key==='u'||e.key==='U'){kUndo()}
  else if(e.key==='s'||e.key==='S'){kSkip()}
});

/* ===== Fitur kemudahan (v5) ===== */
(function hxEase(){
  const KEY='hx.a11y';
  let A; try{A=Object.assign({hc:false,read:false,bighz:false,brief:false,nopy:false,noar:false,font:100,vib:true,last:''},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){A={hc:false,read:false,bighz:false,brief:false,nopy:false,noar:false,font:100,vib:true,last:''}}

  };
  let lp=null, lpX=0, lpY=0;
  document.addEventListener('pointerdown',(e)=>{const el=e.target.closest?.('.py,.hz,.ar');if(!el)return;lpX=e.clientX;lpY=e.clientY;clearTimeout(lp);lp=setTimeout(()=>{copyText(el.textContent.trim());if(A.vib&&navigator.vibrate)navigator.vibrate(15)},500)});
  document.addEventListener('pointermove',(e)=>{if(lp&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10)){clearTimeout(lp);lp=null}});

  // Panel Kemudahan (sheet) untuk layar sentuh

  const closeEase=()=>{if(!sheet)return;sheet.classList.remove('open');sheetBg.classList.remove('open');const x=sheet,y=sheetBg;setTimeout(()=>{x.remove();y.remove()},300);sheet=null;sheetBg=null};

      <div class="r"><span>Ukuran teks</span><div class="fontrow"><button data-font="-">A−</button><span>${A.font}%</span><button data-font="+">A+</button></div></div>

  };

(function hxMobile(){

  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}};
  const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const e2=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const W=()=>(typeof words!=='undefined'&&Array.isArray(words))?words:[];

  const ov=document.createElement('div');ov.className='hxt-ov';document.body.appendChild(ov);
  const close=()=>ov.classList.remove('on');

  // Timer belajar 25/5
  let pT=0,pLeft=25*60,pMode='kerja',pRun=false;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const renderP=()=>{const el=document.getElementById('hxtP');if(!el)return;
    el.textContent=fmt(pLeft);
    document.getElementById('hxtPm').textContent=(pMode==='kerja'?'Belajar':'Istirahat')+' · sesi hari ini: '+(T.pomo.day===today()?T.pomo.n:0);
    document.getElementById('hxtPb').textContent=pRun?'Jeda':'Mulai'};
  const stopP=()=>{pRun=false;clearInterval(pT);renderP()};
  const startP=()=>{if(pRun)return;pRun=true;pT=setInterval(tickP,1000);renderP()};
  function tickP(){
    pLeft--;
    if(pLeft>0){renderP();return}
    stopP();
    if(pMode==='kerja'){
      if(T.pomo.day!==today())T.pomo={day:today(),n:0};
      T.pomo.n++;save();pMode='istirahat';pLeft=5*60;
      toast('Sesi belajar selesai! Istirahat 5 menit.');
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    }else{pMode='kerja';pLeft=25*60;toast('Istirahat selesai. Mulai belajar lagi.')}
    renderP();
  }
  const toast=(m)=>{try{if(typeof window.toast==='function'&&window.toast!==toast)return window.toast(m)}catch(e){}const t=document.getElementById('toast');if(t){t.textContent=m;t.classList.add('on');clearTimeout(window.__hxtT);window.__hxtT=setTimeout(()=>t.classList.remove('on'),2300)}else alert(m)};

  const stats=()=>{const a=W();const c=a.reduce((s,w)=>s+(w.correct||0),0),x=a.reduce((s,w)=>s+(w.wrong||0),0);
    return {total:a.length,star:a.filter(w=>w.star).length,acc:c+x?Math.round(c/(c+x)*100):0,mastered:a.filter(w=>(w.correct||0)>=3&&(w.correct||0)>(w.wrong||0)).length}};
  const wordOfDay=()=>{const a=W();if(!a.length)return null;let h=0;for(const ch of today())h=(h*31+ch.charCodeAt(0))>>>0;return a[h%a.length]};
  const examLeft=()=>{if(!T.exam)return null;const [y,m,d]=T.exam.split('-').map(Number);const t=new Date(y,m-1,d);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000)};

  const backup=()=>{
    let settings=null;try{settings=JSON.parse(localStorage.getItem('pv2.settings')||'null')}catch(e){}
    const data={app:'pinyin-hsk',v:10,date:new Date().toISOString(),words:W(),groups:(typeof groups!=='undefined'?groups:[]),settings,tools:T};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-pinyin-hsk-'+today()+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  };
  const restore=(file)=>{const r=new FileReader();r.onload=()=>{
    let d;try{d=JSON.parse(r.result);if(!Array.isArray(d.words)||!Array.isArray(d.groups))throw new Error('bad')}catch(e){toast('File backup tidak valid');return}
    if(!confirm('Pulihkan backup ini? Data sekarang akan diganti.'))return;
    try{localStorage.setItem('pv2.words',JSON.stringify(d.words));localStorage.setItem('pv2.groups',JSON.stringify(d.groups));
      if(d.settings)localStorage.setItem('pv2.settings',JSON.stringify(d.settings));
      if(d.tools)localStorage.setItem(KEY,JSON.stringify(d.tools));}catch(e){toast('Gagal memulihkan');return}
    location.reload();
  };r.readAsText(file)};

  function build(){
    const s=stats(),w=wordOfDay(),e=examLeft();
    ov.innerHTML=`<div class="hxt-sh" role="dialog" aria-label="Alat belajar">
      <h2>Alat belajar<button type="button" class="hxt-x" data-x aria-label="Tutup">✕</button></h2>
      <div class="hxt-c"><h3>Fitur premium</h3><div class="muted">15 alat tambahan: pencarian, ujian simulasi, flashcard, impor, cetak, lencana, dan lainnya.</div><div><button class="hxt-btn pri" data-a="premium">Buka fitur premium</button></div></div><div class="hxt-c"><h3>Ringkasan progres</h3><div class="big">${s.total} kata</div>
        <div class="muted">${s.star} berbintang · ketepatan ${s.acc}% · ${s.mastered} sudah lancar</div></div>
      <div class="hxt-c"><h3>Kata hari ini</h3>${w?`<div class="big">${e2(w.hanzi)} <span class="muted">${e2(w.pinyin)}</span></div><div>${e2(mean(w))}</div>`:'<div class="muted">Belum ada kata</div>'}</div>
      <div class="hxt-c"><h3>Hitung mundur ujian HSK</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="date" id="hxtEx" class="hxt-inp" value="${e2(T.exam)}" aria-label="Tanggal ujian"><button class="hxt-btn pri" data-a="exsave">Simpan</button></div>
        <div class="muted" style="margin-top:6px">${e===null?'Belum diatur':e>0?'Tinggal '+e+' hari lagi':e===0?'Hari ini ujian. Semangat!':'Ujian sudah lewat'}</div></div>
      <div class="hxt-c"><h3>Timer belajar 25 / 5 menit</h3>
        <div class="big" id="hxtP" style="font-variant-numeric:tabular-nums">${fmt(pLeft)}</div>
        <div class="muted" id="hxtPm"></div>
        <div><button class="hxt-btn pri" id="hxtPb" data-a="pomo">Mulai</button><button class="hxt-btn" data-a="pomoreset">Reset</button></div></div>
      <div class="hxt-c"><h3>Cadangan data</h3><div class="muted">Simpan semua kata, kelompok, dan pengaturan ke file, lalu pulihkan kapan saja.</div>
        <div><button class="hxt-btn pri" data-a="backup">Unduh backup</button><label class="hxt-btn">Pulihkan dari file<input type="file" accept="application/json,.json" data-a="restore" hidden></label></div></div>
    </div>`;
    renderP();
  }
  function open(){build();ov.classList.add('on')}

  ov.addEventListener('click',e=>{
    const t=e.target.closest('[data-a],[data-x]');
    if(!t){if(e.target===ov)close();return}
    if(t.hasAttribute('data-x'))return close();
    const a=t.dataset.a;
    if(a==='exsave'){T.exam=document.getElementById('hxtEx').value;save();toast(T.exam?'Tanggal ujian disimpan':'Tanggal ujian dihapus');build()}
    else if(a==='pomo'){pRun?stopP():startP()}
    else if(a==='pomoreset'){stopP();pMode='kerja';pLeft=25*60;renderP()}
    else if(a==='backup')backup();
    else if(a==='premium')window.hxPremium&&window.hxPremium.open();
  });
  ov.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(e.target.dataset.a==='restore'&&f)restore(f)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('on'))close()});
  window.hxTools={open};
})();
</script>

  const _sv=window.setView;
  window.setView=function(name){_sv(name);window.hxFab&&window.hxFab.paint()};

<button class="hxp-fx" id="hxpFx" aria-label="Keluar mode fokus">Keluar fokus</button>
<div id="hxpa"></div>
<script>
(function(){
  const PK='hx.prem';
  const appRender=(typeof window.render==='function')?window.render:null;
  const blankP=()=>({notes:{},remind:{on:false,time:'19:00',last:''},wake:false});
  let P; try{P=Object.assign(blankP(),JSON.parse(localStorage.getItem(PK)||'{}'))}catch(e){P=blankP()}
  const savep=()=>{try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const W=()=>(typeof words!=='undefined'&&Array.isArray(words))?words:[];
  const G=()=>(typeof groups!=='undefined'&&Array.isArray(groups))?groups:[];
  const say=(m)=>{if(typeof window.toast==='function')window.toast(m);else alert(m)};
  const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
  const wl=w=>`<div class="hxp-w"><div><b>${esc(w.hanzi)}</b> <span class="muted">${esc(w.pinyin)}</span></div><div>${esc(mean(w))}</div></div>`;
  const gsel=(id)=>`<select id="${id}" class="hxp-inp" aria-label="Pilih kelompok">${G().map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select>`;

  const ov=document.createElement('div');ov.className='hxp-ov';document.body.appendChild(ov);
  const close=()=>ov.classList.remove('on');
  const TITLE={search:'Cari kosakata',starred:'Kata berbintang',hard:'Kata sulit',flash:'Kartu acak',exam:'Ujian simulasi',import:'Impor dari teks',print:'Cetak daftar',share:'Bagikan kelompok',groups:'Ringkasan kelompok',badges:'Lencana',notes:'Catatan pribadi',remind:'Pengingat harian',focus:'Mode fokus',wake:'Layar tetap menyala'};
  const CARDS=[['search','⌕','Cari kosakata'],['starred','★','Kata berbintang'],['hard','!','Kata sulit'],['flash','▣','Kartu acak'],['exam','✎','Ujian simulasi'],['import','⤓','Impor dari teks'],['csv','⤒','Ekspor CSV'],['print','⎙','Cetak daftar'],['share','↗','Bagikan kelompok'],['groups','▤','Ringkasan kelompok'],['badges','◆','Lencana'],['notes','✐','Catatan pribadi'],['remind','◷','Pengingat harian'],['focus','◎','Mode fokus'],['wake','☀','Layar tetap menyala']];

  let cur='home', sq='', nq='', noteId=null, flash=null, flashShow=false, exam=null, lock=null;

  const srchRes=()=>{const q=sq.trim().toLowerCase();if(!q)return '<p class="muted">Ketik untuk mencari.</p>';
    const a=W().filter(w=>[w.pinyin,w.hanzi,mean(w)].some(x=>String(x||'').toLowerCase().includes(q))).slice(0,80);
    return a.length?a.map(wl).join(''):'<p class="muted">Tidak ditemukan.</p>'};
  const noteList=()=>{const q=nq.trim().toLowerCase();
    const a=W().filter(w=>!q||[w.pinyin,w.hanzi,mean(w)].some(x=>String(x||'').toLowerCase().includes(q))).slice(0,60);
    return a.length?a.map(w=>`<button class="hxp-row1" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);text-align:left;cursor:pointer" data-pa="nsel" data-v="${esc(w.id)}"><span>${esc(w.hanzi)} ${esc(mean(w))}</span><span>${P.notes[w.id]?'✎':''}</span></button>`).join(''):'<p class="muted">Tidak ada kata.</p>'};
  const examHtml=()=>{
    if(!exam)return '<p class="muted">20 soal pilihan ganda dari kosakatamu. Pilih arti yang benar.</p><button class="hxp-btn pri" data-pa="examstart">Mulai ujian</button>';
    if(exam.done)return `<div class="hxp-card"><div class="big">Skor ${exam.score} / ${exam.qs.length}</div><div class="muted">${Math.round(exam.score/exam.qs.length*100)}% benar</div></div><button class="hxp-btn pri" data-pa="examstart">Ulangi</button>`;
    const q=exam.qs[exam.i];
    const opts=q.opts.map((o,i)=>{let c='';if(exam.pick!==null){if(i===q.ans)c=' ok';else if(i===exam.pick)c=' bad'}return `<button class="hxp-opt${c}" data-pa="epick" data-v="${i}" ${exam.pick!==null?'disabled':''}>${esc(o)}</button>`}).join('');
    return `<div class="muted">Soal ${exam.i+1} dari ${exam.qs.length}</div><div class="hxp-card"><div class="big">${esc(q.w.hanzi||q.w.pinyin)}</div><div class="muted">${esc(q.w.pinyin)}</div></div>${opts}${exam.pick!==null?`<button class="hxp-btn pri" data-pa="enext">${exam.i+1<exam.qs.length?'Lanjut':'Lihat hasil'}</button>`:''}`;
  };
  const startExam=()=>{const a=shuffle(W().filter(w=>mean(w)));if(a.length<4){say('Minimal 4 kata untuk ujian');return}
    const n=Math.min(20,a.length);
    const qs=a.slice(0,n).map(w=>{const others=shuffle(a.filter(x=>x.id!==w.id)).slice(0,3).map(x=>mean(x));const opts=shuffle([mean(w),...others]);return {w,opts,ans:opts.indexOf(mean(w))}});
    exam={qs,i:0,score:0,done:false,pick:null}};
  const badgesHtml=()=>{const a=W();const tc=a.reduce((s,w)=>s+(w.correct||0),0),tt=a.reduce((s,w)=>s+(w.correct||0)+(w.wrong||0),0);
    const acc=tt?Math.round(tc/tt*100):0;const star=a.filter(w=>w.star).length;const mast=a.filter(w=>(w.correct||0)>=3&&(w.correct||0)>(w.wrong||0)).length;
    const streak=(typeof S!=='undefined'&&S&&S.streak)?(S.streak.count||0):0;
    const B=[['Pemula','Jawab benar 10 kali',tc,10],['Rajin','Belajar 3 hari berturut-turut',streak,3],['Bintang','Beri bintang 5 kata',star,5],['Teliti','Akurasi 80% dari minimal 20 jawaban',tt>=20?acc:0,80],['Koleksi','Punya 100 kata',a.length,100],['Lancar','10 kata sudah lancar',mast,10]];
    return B.map(([n,d,v,t])=>`<div class="hxp-w"><div><b>${n}</b> ${v>=t?'✓':'🔒'}</div><div class="muted">${d} (${Math.min(v,t)}/${t})</div></div>`).join('')};
  const groupsHtml=()=>G().map(g=>{const a=W().filter(w=>w.g===g.id);const c=a.reduce((s,w)=>s+(w.correct||0),0),x=a.reduce((s,w)=>s+(w.wrong||0),0);
    return `<div class="hxp-w"><div><b>${esc(g.name)}</b></div><div class="muted">${a.length} kata · ketepatan ${c+x?Math.round(c/(c+x)*100):0}%</div></div>`}).join('')||'<p class="muted">Belum ada kelompok.</p>';

  function flashHtml(){const a=W();if(!a.length)return '<p class="muted">Belum ada kata.</p>';
    if(!flash||!a.includes(flash))flash=a[Math.floor(Math.random()*a.length)];
    return `<div class="hxp-card"><div class="big">${esc(flash.hanzi||flash.pinyin)}</div><div class="muted">${esc(flash.pinyin)}</div>${flashShow?`<div style="margin-top:8px">${esc(mean(flash))}</div>`:''}</div>
      <div>${flashShow?'':'<button class="hxp-btn" data-pa="fshow">Tampilkan arti</button>'}<button class="hxp-btn" data-pa="fknow">Sudah tahu</button><button class="hxp-btn" data-pa="fnot">Belum tahu</button><button class="hxp-btn" data-pa="fnext">Acak lagi</button></div>`}

  function body(){
    switch(cur){
      case 'home': return `<div class="hxp-grid">${CARDS.map(([id,ic,t])=>`<button class="hxp-card2" data-p="${id}"><span class="ic">${ic}</span>${t}</button>`).join('')}</div><p class="muted" style="margin-top:12px">Semua fitur ini bekerja di perangkat ini tanpa akun.</p>`;
      case 'search': return `<input class="hxp-inp" data-pa="sq" value="${esc(sq)}" placeholder="Cari pinyin, Hanzi, atau arti" aria-label="Cari"><div id="hxpR" class="hxp-list">${srchRes()}</div>`;
      case 'starred': { const a=W().filter(w=>w.star); return `<div class="hxp-list">${a.length?a.map(wl).join(''):'<p class="muted">Belum ada kata berbintang.</p>'}</div>` }
      case 'hard': { const a=W().filter(w=>(w.wrong||0)>(w.correct||0)); return `<div class="hxp-list">${a.length?a.map(wl).join(''):'<p class="muted">Tidak ada kata sulit. Bagus!</p>'}</div>` }
      case 'flash': return flashHtml();
      case 'exam': return examHtml();
      case 'import': return `<p class="muted">Satu kata per baris, format: pinyin | hanzi | arti</p><input class="hxp-inp" id="hxpN" value="Impor ${today()}" aria-label="Nama kelompok"><textarea class="hxp-inp" id="hxpT" placeholder="ni hao | 你好 | halo"></textarea><button class="hxp-btn pri" data-pa="doimport">Tambahkan kelompok</button>`;
      case 'print': return `${gsel('hxpG')}<button class="hxp-btn pri" data-pa="doprint">Cetak</button>`;
      case 'share': return `${gsel('hxpG2')}<button class="hxp-btn pri" data-pa="doshare">Bagikan</button><p class="muted">Di HP, memakai menu bagikan. Jika tidak tersedia, teks disalin.</p>`;
      case 'groups': return `<div class="hxp-list">${groupsHtml()}</div>`;
      case 'badges': return `<div class="hxp-list">${badgesHtml()}</div>`;
      case 'notes': { const w=noteId?W().find(x=>x.id===noteId):null;
        return `<input class="hxp-inp" data-pa="nq" value="${esc(nq)}" placeholder="Cari kata" aria-label="Cari kata"><div id="hxpNL" class="hxp-list">${noteList()}</div>${w?`<div class="hxp-card"><b>${esc(w.hanzi)}</b> ${esc(mean(w))}</div><textarea class="hxp-inp" id="hxpNT" placeholder="Tulis catatanmu">${esc(P.notes[w.id]||'')}</textarea><button class="hxp-btn pri" data-pa="nsave">Simpan catatan</button>`:'<p class="muted">Pilih kata untuk menulis catatan.</p>'}`; }
      case 'remind': return `<div class="hxp-row1"><span>Aktifkan pengingat</span><input type="checkbox" data-pa="rtog" ${P.remind.on?'checked':''}></div><div class="hxp-row1"><span>Jam</span><input type="time" class="hxp-inp" style="width:auto" data-pa="rtime" value="${esc(P.remind.time)}"></div><p class="muted">Pengingat muncul saat aplikasi terbuka pada jam tersebut. Notifikasi sistem muncul jika diizinkan.</p>`;
      case 'focus': return `<p class="muted">Mode fokus menyembunyikan tombol dan menu supaya belajar lebih tenang. Tombol "Keluar fokus" tetap tampil di pojok kiri bawah.</p><button class="hxp-btn pri" data-pa="ftoggle">${document.body.classList.contains('hx-focus')?'Matikan mode fokus':'Aktifkan mode fokus'}</button>`;
      case 'wake': return `<p class="muted">Layar tidak akan mati saat halaman ini terbuka. Berguna saat belajar sambil menatap layar lama. Membutuhkan browser yang mendukung.</p><button class="hxp-btn pri" data-pa="wtoggle">${P.wake?'Matikan':'Aktifkan'}</button> <span class="muted">${P.wake?'Status: aktif':'Status: mati'}</span>`;
    }
    return '';
  }
  function render(){
    ov.innerHTML=`<div class="hxp-sh" role="dialog" aria-label="Fitur premium"><h2><span>${cur==='home'?'Fitur premium':esc(TITLE[cur])}</span><span>${cur!=='home'?'<button class="hxp-btn" data-back>← Kembali</button>':''}<button class="hxp-x" data-x aria-label="Tutup">✕</button></span></h2><div class="hxp-b">${body()}</div></div>`;
  }
  function nextFlash(){flashShow=false;flash=null;render()}

  function doCsv(){
    const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
    const rows=[['pinyin','hanzi','arti','benar','salah','bintang'].join(',')].concat(W().map(w=>[w.pinyin,w.hanzi,w.arti,w.correct||0,w.wrong||0,w.star?'ya':'tidak'].map(q).join(',')));
    const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kosakata-hsk-'+today()+'.csv';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);say('CSV diunduh');
  }
  function doPrint(gid){
    const g=G().find(x=>x.id===gid);const a=W().filter(w=>w.g===gid);
    const pa=document.getElementById('hxpa');
    pa.innerHTML=`<h2>${esc(g?g.name:'Kosakata')}</h2><table><tr><th>Pinyin</th><th>Hanzi</th><th>Arti</th></tr>${a.map(w=>`<tr><td>${esc(w.pinyin)}</td><td>${esc(w.hanzi)}</td><td>${esc(mean(w))}</td></tr>`).join('')}</table>`;
    const done=()=>{document.body.classList.remove('hx-printing');window.removeEventListener('afterprint',done)};
    window.addEventListener('afterprint',done);
    document.body.classList.add('hx-printing');
    setTimeout(()=>window.print(),50);
  }
  async function doShare(gid){
    const g=G().find(x=>x.id===gid);if(!g)return;
    const a=W().filter(w=>w.g===gid);
    const text=`${g.name}\n`+a.map(w=>`${w.hanzi||''} (${w.pinyin}) - ${w.arti}`).join('\n');
    try{if(navigator.share){await navigator.share({title:g.name,text});return}}catch(e){return}
    try{await navigator.clipboard.writeText(text);say('Kelompok disalin')}catch(e){say('Gagal menyalin')}
  }
  async function lockOn(){try{if(!('wakeLock' in navigator)){say('Perangkat tidak mendukung layar tetap menyala');return}
    lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}catch(e){lock=null}}
  function lockOff(){try{lock&&lock.release()}catch(e){}lock=null}
  document.addEventListener('visibilitychange',()=>{if(P.wake&&document.visibilityState==='visible'&&!lock)lockOn()});
  if(P.wake)setTimeout(lockOn,1500);

  setInterval(()=>{
    if(!P.remind.on)return;
    const d=new Date();const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    if(hm===P.remind.time&&P.remind.last!==today()){
      P.remind.last=today();savep();say('Waktunya belajar HSK hari ini!');
      try{if(window.Notification&&Notification.permission==='granted')new Notification('Belajar HSK',{body:'Yuk sisihkan 10 menit untuk belajar.'})}catch(e){}
    }
  },20000);

  ov.addEventListener('click',e=>{
    const t=e.target.closest('[data-p],[data-pa],[data-x],[data-back]');
    if(!t){if(e.target===ov)close();return}
    if(t.hasAttribute('data-x'))return close();
    if(t.hasAttribute('data-back')){cur='home';render();return}
    if(t.dataset.p){
      if(t.dataset.p==='csv'){doCsv();return}
      cur=t.dataset.p;render();return;
    }
    const a=t.dataset.pa;
    if(a==='fshow'){flashShow=true;render()}
    else if(a==='fknow'&&flash){const id=flash.id;window.upd?upd(id,w=>({...w,correct:(w.correct||0)+1})):null;persist();nextFlash()}
    else if(a==='fnot'&&flash){const id=flash.id;window.upd?upd(id,w=>({...w,wrong:(w.wrong||0)+1})):null;persist();nextFlash()}
    else if(a==='fnext')nextFlash();
    else if(a==='examstart'){startExam();render()}
    else if(a==='epick'){if(exam&&!exam.done&&exam.pick===null){const idx=+t.dataset.v;exam.pick=idx;if(idx===exam.qs[exam.i].ans)exam.score++;render()}}
    else if(a==='enext'){exam.i++;exam.pick=null;if(exam.i>=exam.qs.length)exam.done=true;render()}
    else if(a==='doimport'){
      const name=(document.getElementById('hxpN').value||'Impor').trim()||'Impor';
      const lines=document.getElementById('hxpT').value.split('\n').map(l=>l.split('|').map(x=>x.trim()));
      const ok=lines.filter(p=>p[0]&&p[2]);
      if(!ok.length){say('Tidak ada baris valid. Format: pinyin | hanzi | arti');return}
      const gid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      G().push({id:gid,name,t:Date.now()});
      ok.forEach((p,i)=>W().push({id:'w'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5),g:gid,pinyin:p[0],hanzi:p[1]||'',arti:p.slice(2).join(' | '),correct:0,wrong:0,star:false,t:Date.now()+i}));
      persist();if(appRender)appRender();
      say(ok.length+' kata ditambahkan');cur='home';render();
    }
    else if(a==='doprint'){doPrint(document.getElementById('hxpG').value)}
    else if(a==='doshare'){doShare(document.getElementById('hxpG2').value)}
    else if(a==='nsel'){noteId=t.dataset.v;render()}
    else if(a==='nsave'){const v=document.getElementById('hxpNT').value.trim();if(v)P.notes[noteId]=v;else delete P.notes[noteId];savep();say('Catatan disimpan');render()}
    else if(a==='ftoggle'){document.body.classList.toggle('hx-focus');render()}
    else if(a==='wtoggle'){P.wake=!P.wake;savep();if(P.wake)lockOn();else lockOff();render()}
  });
  ov.addEventListener('input',e=>{
    const a=e.target.dataset.pa;
    if(a==='sq'){sq=e.target.value;const r=document.getElementById('hxpR');if(r)r.innerHTML=srchRes()}
    else if(a==='nq'){nq=e.target.value;const r=document.getElementById('hxpNL');if(r)r.innerHTML=noteList()}
  });
  ov.addEventListener('change',e=>{
    const a=e.target.dataset.pa;
    if(a==='rtog'){P.remind.on=e.target.checked;if(P.remind.on&&window.Notification&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});savep()}
    else if(a==='rtime'){P.remind.time=e.target.value||'19:00';P.remind.last='';savep()}
  });
  document.getElementById('hxpFx').addEventListener('click',()=>{document.body.classList.remove('hx-focus')});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('on'))close()});
  window.hxPremium={open:()=>{cur='home';render();ov.classList.add('on')},openTo:(k)=>{cur=k;render();ov.classList.add('on')}};
})();
</script>

    atur:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
    gamepad:'<rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v3M6 12h3"/><circle cx="15.8" cy="11.2" r=".7"/><circle cx="18" cy="13.4" r=".7"/>'
  };
  const FLOWS=['kartu','kuis','pasangan','dengar','hujan','teka'];
  const inGame=()=>FLOWS.includes(document.body.dataset.view);
  const svg=(k)=>`<svg class="fbg-ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="url(#hxGoldG)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
  const ITEMS=[...GAMES.map(([k,l])=>[k,l]),['atur','Atur tombol game']];
  const ALLON=Object.fromEntries(ITEMS.map(([k])=>[k,true]));
  const DEFS={side:'kiri',pos:'bawah',shape:'bulat',style:'warna',color:'',d3:false,fade:1,autoFade:true,idleOp:0.45,touch:'tetap',show:true,autoHide:false,autoSec:4,edge:true,labels:true,items:ALLON};
  let C; try{C=Object.assign({},DEFS,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){C=Object.assign({},DEFS)}
  C.items=Object.assign({},DEFS.items,C.items||{});
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}};
  const conv=v=>v==='true'?true:v==='false'?false:/^\d+$/.test(v)?Number(v):v;
  const PAL=()=>window.HX_PAL||[['Jade','#1E6A58']];
  const SHAPES=()=>window.HX_SHAPES||[['bulat','Bulat']];
  const wrap=document.createElement('div'); wrap.className='fb fbg'; wrap.setAttribute('aria-label','Tombol pilihan game'); document.body.appendChild(wrap);
  const edge=document.createElement('button'); edge.className='fb-edge'; edge.setAttribute('aria-label','Tampilkan tombol pilihan game'); document.body.appendChild(edge);
  let panel=null;
  const say=(m)=>{if(typeof window.toast==='function')window.toast(m)};
  const act=(k)=>{
    if(k==='trigger'){if(!justDragged)wrap.classList.toggle('open');return}
    if(k==='atur')togglePanel();
    else{wrap.classList.remove('open');if(window.openMode)window.openMode(k)}
    paint();
    if(k!=='atur'){
      if(C.touch==='hilang')tuck(true);
      else if(C.touch==='hilang1')setTimeout(()=>tuck(true),1000);
      else if(C.touch==='berkedip'){const b=wrap.querySelector(`[data-k="${k}"]`);if(b){b.classList.add('blink');setTimeout(()=>b.classList.remove('blink'),1300)}}
    }
  };
  const applyOp=()=>{const on=C.autoFade!==false;wrap.style.setProperty('--fb-op',on?(wrap.classList.contains('lit')?1:(C.idleOp??0.45)):C.fade)};
  let litT=0;
  const unlight=()=>{if(wrap.classList.contains('open')){litT=setTimeout(unlight,2000);return}wrap.classList.remove('lit');applyOp()};
  const light=()=>{wrap.classList.add('lit');applyOp();clearTimeout(litT);litT=setTimeout(unlight,2000)};
  wrap.addEventListener('pointerdown',light,true);
  wrap.addEventListener('pointermove',light,true);
  const paint=()=>{
    wrap.style.display=(C.show&&inGame())?'':'none';
    const fp=C.y!=null;
    wrap.classList.toggle('freepos',fp);
    if(fp){const H=window.innerHeight,t=Math.round(C.y*H);wrap.style.top=t+'px';wrap.style.bottom='auto';wrap.style.maxHeight=Math.max(120,H-t-16)+'px'}
    else{wrap.style.top='';wrap.style.bottom='';wrap.style.maxHeight=''}
    if(C.dx!=null){if(C.side==='kiri'){wrap.style.left=C.dx+'px';wrap.style.right='auto'}else{wrap.style.right=C.dx+'px';wrap.style.left='auto'}}
    else{wrap.style.left='';wrap.style.right=''}
    if(!inGame())wrap.classList.remove('open');
    wrap.dataset.side=C.side; wrap.dataset.pos=C.pos; wrap.dataset.shape=C.shape; wrap.dataset.style=C.style; wrap.dataset.labels=C.labels?'on':'off';
    wrap.classList.toggle('ico3d',!!C.d3);
    if(C.color)wrap.style.setProperty('--fb-c',C.color);else wrap.style.removeProperty('--fb-c');
    applyOp();
    edge.className='fb-edge '+C.side; edge.style.display=(C.show&&C.edge&&inGame())?'':'none';
    const items=ITEMS.filter(([k])=>C.items[k]);
    wrap.innerHTML=items.map(([k,l])=>`<button class="fb-b fbg-it" data-k="${k}" aria-label="${l}">${svg(k)}<span class="fb-l">${l}</span></button>`).join('')+
      `<button class="fb-b fbg-trig" data-k="trigger" aria-label="Pilih game" aria-expanded="${wrap.classList.contains('open')}">${svg('gamepad')}</button>`;
    wrap.querySelectorAll('.fb-b').forEach(b=>b.onclick=(e)=>{e.stopPropagation();act(b.dataset.k)});
  };
  let justDragged=false;
  wrap.addEventListener('pointerdown',(e)=>{
    const t=e.target.closest&&e.target.closest('.fbg-trig'); if(!t)return;
    const sx0=e.clientX, sy0=e.clientY; let r0=null, moved=false;
    const mv=(ev)=>{
      const dx=ev.clientX-sx0, dy=ev.clientY-sy0; if(!moved&&Math.hypot(dx,dy)<6)return;
      if(!moved){moved=true;wrap.classList.add('dragging');wrap.classList.remove('open');r0=wrap.getBoundingClientRect()}
      const W=window.innerWidth,H=window.innerHeight,w=r0.width,h=wrap.getBoundingClientRect().height;
      const left=Math.min(Math.max(4,r0.left+dx),W-w-4), top=Math.min(Math.max(8,r0.top+dy),H-h-8);
      wrap.classList.add('freepos');
      wrap.style.left=left+'px'; wrap.style.right='auto'; wrap.style.top=top+'px'; wrap.style.bottom='auto';
      wrap.dataset.side=left+w/2<W/2?'kiri':'kanan';
    };
    const up=()=>{
      window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
      if(!moved)return;
      const W=window.innerWidth,H=window.innerHeight, r=wrap.getBoundingClientRect();
      C.side=r.left+r.width/2<W/2?'kiri':'kanan';
      C.dx=C.side==='kiri'?Math.round(r.left):Math.round(W-r.right);
      C.y=Math.min(0.92,Math.max(0.02,r.top/H));
      wrap.classList.remove('dragging');
      justDragged=true; setTimeout(()=>{justDragged=false},350);
      save(); paint();
    };
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });
  let idleT=0;
  const tuck=(on)=>{clearTimeout(idleT);wrap.classList.toggle('tuck',on&&C.edge);wrap.classList.toggle('hidden',on&&!C.edge);if(!on)armIdle()};
  const armIdle=()=>{clearTimeout(idleT);if(C.autoHide&&C.show)idleT=setTimeout(()=>{if(!panel)tuck(true)},C.autoSec*1000)};
  const wake=()=>{if(C.touch==='hilang1'&&C.show&&(wrap.classList.contains('tuck')||wrap.classList.contains('hidden'))){wrap.classList.remove('tuck','hidden');return}if(!C.autoHide||!C.show)return;wrap.classList.remove('tuck','hidden');armIdle()};
  edge.onclick=()=>tuck(false);
  let sx=null;
  document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',e=>{if(sx==null||!C.edge)return;const dx=e.changedTouches[0].clientX-sx;if(C.side==='kiri'&&sx<24&&dx>40)tuck(false);if(C.side==='kanan'&&sx>window.innerWidth-24&&dx<-40)tuck(false);sx=null},{passive:true});

  function togglePanel(){
    if(panel){panel.remove();panel=null;return}
    panel=document.createElement('div'); panel.className='fb-panel';
    const seg=(key,opts)=>`<div class="seg2">${opts.map(([v,l])=>`<button data-key="${key}" data-v="${v}" class="${C[key]===v?'on':''}">${l}</button>`).join('')}</div>`;
    panel.innerHTML=`<h3>Tombol pilihan game</h3>
      <div class="row"><span>Sisi</span>${seg('side',[['kiri','Kiri'],['kanan','Kanan']])}</div>
      <div class="row"><span>Posisi</span>${seg('pos',[['atas','Atas'],['tengah','Tengah'],['bawah','Bawah']])}</div>
      <div class="row"><span>Bentuk</span><select data-gskey="shape" aria-label="Bentuk ikon">${SHAPES().map(([v,l])=>`<option value="${v}" ${C.shape===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="row"><span>Ikon 3D</span><input type="checkbox" data-gd3 ${C.d3?'checked':''}></div>
      <div class="row"><span>Model ikon</span><select data-gskey="style" aria-label="Model ikon">${[['warna','Warna'],['menyatu','Menyatu'],['kaca','Kaca'],['garis','Garis'],['neon','Neon'],['bayangan','Bayangan'],['minimal','Minimal']].map(([v,l])=>`<option value="${v}" ${C.style===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="row"><span>Warna</span><div class="seg2" style="flex-wrap:wrap;justify-content:flex-end;max-width:190px">${PAL().map(([n,c])=>`<span class="sw ${C.color===c?'on':''}" title="${n}" data-gcolor="${c}" style="background:${c};display:inline-block"></span>`).join('')}</div></div>
      <div class="row"><span>Transparansi</span><input type="range" min="0.3" max="1" step="0.05" value="${C.fade}" data-gfade></div>
      <div class="row"><span>Pudar otomatis</span><input type="checkbox" data-gafade ${C.autoFade!==false?'checked':''}></div>
      <div class="row"><span>Tampilkan</span>${seg('show',[[true,'Tampil'],[false,'Sembunyi']])}</div>
      <div class="row"><span>Saat disentuh</span>${seg('touch',[['tetap','Tetap'],['berkedip','Berkedip'],['hilang','Hilang'],['hilang1','Hilang 1 dtk']])}</div>
      <div class="row"><span>Hilang otomatis</span>${seg('autoHide',[[false,'Mati'],[true,'Aktif']])}</div>
      <div class="row"><span>Lama sebelum hilang</span>${seg('autoSec',[[1,'1 dtk'],[3,'3 dtk'],[5,'5 dtk'],[10,'10 dtk']])}</div>
      <div class="row"><span>Geser tepi untuk muncul</span><input type="checkbox" data-gedge ${C.edge?'checked':''}></div>
      <div class="row"><span>Label saat disentuh</span><input type="checkbox" data-glabels ${C.labels?'checked':''}></div>
      ${ITEMS.map(([k,l])=>`<div class="row"><span>${l}</span><input type="checkbox" data-gitem="${k}" ${C.items[k]?'checked':''}></div>`).join('')}`;
    document.body.appendChild(panel);
    panel.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{C[b.dataset.key]=conv(b.dataset.v);if(b.dataset.key==='pos')C.y=null;if(b.dataset.key==='side')C.dx=null;save();paint();togglePanel();togglePanel()});
    panel.querySelectorAll('[data-gcolor]').forEach(b=>b.onclick=()=>{C.color=b.dataset.gcolor;save();paint();togglePanel();togglePanel()});
    panel.querySelector('[data-gfade]').oninput=(e)=>{C.fade=Number(e.target.value);save();paint()};
    panel.querySelector('[data-gafade]').onchange=(e)=>{C.autoFade=e.target.checked;save();paint()};
    panel.querySelectorAll('select[data-gskey]').forEach(s=>s.onchange=()=>{C[s.dataset.gskey]=s.value;save();paint()});
    panel.querySelector('[data-gd3]').onchange=(e)=>{C.d3=e.target.checked;save();paint()};
    panel.querySelector('[data-gedge]').onchange=(e)=>{C.edge=e.target.checked;save();paint()};
    panel.querySelector('[data-glabels]').onchange=(e)=>{C.labels=e.target.checked;save();paint()};
    panel.querySelectorAll('[data-gitem]').forEach(b=>b.onchange=(e)=>{C.items[b.dataset.gitem]=e.target.checked;save();paint()});
  }
  document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&panel){panel.remove();panel=null}});
  document.addEventListener('pointerdown',(e)=>{if(wrap.classList.contains('open')&&!wrap.contains(e.target))wrap.classList.remove('open')});
  new MutationObserver(()=>paint()).observe(document.body,{attributes:true,attributeFilter:['data-view']});
  document.addEventListener('pointerdown',(e)=>{if(panel&&!panel.contains(e.target)&&!wrap.contains(e.target))togglePanel()});

  const set=(p,v)=>{v=conv(v);if(p==='fade'||p==='idleOp')v=Number(v);if(p==='pos')C.y=null;if(p==='side')C.dx=null;if(p==='items')return;if(p.startsWith('items.'))C.items[p.slice(6)]=v;else C[p]=v;save();paint()};
  window.hxGFab={paint,get:()=>C,set,
    rows:()=>{
      const on=(k,v)=>String(C[k])===String(v);
      const seg=(key,opts)=>`<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<button type="button" role="radio" aria-checked="${on(key,v)}" class="${on(key,v)?'on':''}" data-gfabseg="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
      const sw=(key,v)=>`<label class="sw"><input type="checkbox" data-gfabset="${key}" ${v?'checked':''} aria-label="${key}"><span></span></label>`;
      const r=(t,d,c,full)=>`<div class="srow${full?' col':''}"><div><div class="st">${t}</div>${d?`<div class="sd">${d}</div>`:''}</div>${full?'':''}${c}</div>`;
      return r('Tampilkan tombol','Matikan untuk menyembunyikan tombol pilihan game.',sw('show',C.show))+
        r('Sisi','Kiri atau kanan layar',seg('side',[['kiri','Kiri'],['kanan','Kanan']]),true)+
        r('Posisi','Atas, tengah, atau bawah',seg('pos',[['atas','Atas'],['tengah','Tengah'],['bawah','Bawah']]),true)+
        r('Bentuk ikon','Berlaku untuk tombol game',`<select data-gfabset="shape" aria-label="Bentuk ikon">${(window.HX_SHAPES||[]).map(([v,l])=>`<option value="${v}" ${C.shape===v?'selected':''}>${l}</option>`).join('')}</select>`)+
        r('Ikon 3D','Tampilan timbul dengan cahaya dan bayangan',sw('d3',C.d3))+
        r('Warna premium','Warna untuk tombol pilihan game',`<div class="hx-pal"><button type="button" title="Ikuti tema" aria-label="Ikuti tema" data-gfabcolor="" class="hx-sw hx-auto${!C.color?' on':''}"></button>${(window.HX_PAL||[]).map(([n,c])=>`<button type="button" title="${n}" aria-label="Warna ${n}" data-gfabcolor="${c}" class="hx-sw${C.color===c?' on':''}" style="background:${c}"></button>`).join('')}</div>`,true)+
        r('Model ikon','Pilih tampilan tombol pilihan game',`<select data-gfabset="style" aria-label="Model ikon">${[['warna','Warna'],['menyatu','Menyatu'],['kaca','Kaca'],['garis','Garis'],['neon','Neon'],['bayangan','Bayangan'],['minimal','Minimal']].map(([v,l])=>`<option value="${v}" ${C.style===v?'selected':''}>${l}</option>`).join('')}</select>`)+
        r('Transparansi','',`<input type="range" min="0.3" max="1" step="0.05" value="${C.fade}" data-gfabset="fade" aria-label="Transparansi">`)+
        r('Pudar otomatis','Memudar saat tidak disentuh, terang saat disentuh',sw('autoFade',C.autoFade!==false))+
        r('Opasitas saat diam','Seberapa pudar tombol saat tidak disentuh',`<input type="range" min="0.1" max="1" step="0.05" value="${C.idleOp??0.45}" data-gfabset="idleOp" aria-label="Opasitas saat diam">`,true)+
        r('Saat disentuh','Tetap, berkedip, hilang, atau hilang 1 detik setelah dipakai',seg('touch',[['tetap','Tetap'],['berkedip','Berkedip'],['hilang','Hilang'],['hilang1','Hilang 1 dtk']]),true)+
        r('Hilang otomatis','Muncul lagi saat digulir atau disentuh',seg('autoHide',[[false,'Mati'],[true,'Aktif']]))+
        r('Lama sebelum hilang','',seg('autoSec',[[1,'1 dtk'],[3,'3 dtk'],[5,'5 dtk'],[10,'10 dtk']]),true)+
        r('Geser tepi untuk muncul','',sw('edge',C.edge))+
        r('Label saat disentuh','',sw('labels',C.labels))+
        r('Ikon Pengaturan ⚙','Tampilkan atau sembunyikan ikon Pengaturan di tombol pilihan game',sw('items.atur',C.items.atur));
    }
  };

  document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.gfabset)return;const k=t.dataset.gfabset;set(k,t.type==='checkbox'?t.checked:t.value)});
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-gfabseg]');if(!b)return;set(b.dataset.gfabseg,b.dataset.v);b.parentElement.querySelectorAll('button').forEach(x=>{const o=x===b;x.classList.toggle('on',o);x.setAttribute('aria-checked',o)})});
  document.addEventListener('click',e=>{const s=e.target.closest&&e.target.closest('[data-gfabcolor]');if(!s)return;set('color',s.dataset.gfabcolor);s.parentElement.querySelectorAll('[data-gfabcolor]').forEach(x=>x.classList.toggle('on',x===s))});
  document.addEventListener('scroll',wake,true);
  document.addEventListener('pointerdown',wake,true);
  paint();armIdle();
})();
</script>

<script>
/* ===== layar penuh: beranda, bar game, dan ajakan setelah 10 detik ===== */
(function hxFs(){
  const FS_IN_D='M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', FS_OUT_D='M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5';
  const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement)||matchMedia('(display-mode: fullscreen)').matches;
  const syncBtns=()=>{const on=isFs();document.querySelectorAll('.hx-fs').forEach(b=>{const p=b.querySelector('path');if(p)p.setAttribute('d',on?FS_OUT_D:FS_IN_D);b.setAttribute('aria-label',on?'Keluar layar penuh':'Layar penuh');b.title=b.getAttribute('aria-label')})};
  async function toggle(){
    try{
      if(!isFs()){
        const el=document.documentElement;
        await (el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen());
        try{await screen.orientation?.lock?.('portrait')}catch(e){}
      }else{
        await (document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen());
      }
    }catch(e){ if(typeof toast==='function') toast('Layar penuh tidak didukung di browser ini'); }
    syncBtns();
  }
  window.hxToggleFs=toggle;
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-hxfs]');if(b){e.preventDefault();e.stopPropagation();toggle()}},true);

  const closeAsk=()=>document.querySelectorAll('.hx27-ask').forEach(n=>n.remove());
  const onChange=()=>{syncBtns();if(isFs())closeAsk()};
  document.addEventListener('fullscreenchange',onChange);
  document.addEventListener('webkitfullscreenchange',onChange);

  let shown=false;
  const dismissed=()=>sessionStorage.getItem('hxfs-nanti')==='1';
  function ask(){
    if(shown||isFs()||dismissed())return;
    shown=true;
    const box=document.createElement('div');
    box.className='hx27-ask';
    box.setAttribute('role','dialog');
    box.setAttribute('aria-label','Ajakan layar penuh');
    box.innerHTML='<div class="hx27-t">Mau pakai layar penuh?</div><div class="hx27-s">Belajar lebih fokus tanpa bar browser.</div><div class="hx27-b"><button type="button" class="hx27-no">Nanti</button><button type="button" class="hx27-yes">Ya, layar penuh</button></div>';
    box.querySelector('.hx27-no').onclick=()=>{sessionStorage.setItem('hxfs-nanti','1');box.remove()};
    box.querySelector('.hx27-yes').onclick=async()=>{box.remove();await toggle()};
    document.body.appendChild(box);
  }
  const t0=Date.now();
  const iv=setInterval(()=>{
    if(isFs()||shown||dismissed()){clearInterval(iv);return}
    if(Date.now()-t0>=10000 && document.body.dataset.view==='home'){clearInterval(iv);ask()}
  },500);
  syncBtns();
})();
</script>
